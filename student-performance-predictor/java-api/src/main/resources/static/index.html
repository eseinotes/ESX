<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Performance Predictor</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main>
        <h1>Student Performance Predictor</h1>
        <p class="introduction">Manage students and explore a fictional teaching-only grade prediction.</p>

        <section class="panel">
            <h2 id="form-title">Add student</h2>
            <form id="student-form">
                <input id="student-id" type="hidden">
                <label for="student-name">Name</label>
                <input id="student-name" type="text" required>

                <label for="study-hours">Study hours</label>
                <input id="study-hours" type="number" min="0" step="0.5" required>

                <div class="form-actions">
                    <button type="submit">Save student</button>
                    <button id="cancel-edit" class="secondary hidden" type="button">Cancel edit</button>
                </div>
            </form>
            <p id="message" role="status"></p>
        </section>

        <section class="panel">
            <h2>Students</h2>
            <div id="student-list"></div>
        </section>
    </main>
    <script src="/app.js"></script>
</body>
</html>
