services:

  python-service:
    build:
      context: ./python-api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped

  java-api:
    build:
      context: ./java-api
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PYTHON_SERVICE_URL: http://python-service:8000
    depends_on:
      - python-service
    restart: unless-stopped
